<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Áudio</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.6.7/plyr.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap');

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
        }

        .audio-container {
            display: flex;
            align-items: center;
            background-color: #202c33;
            border-radius: 10px;
            padding: 10px;
            width: 320px; /* Ajuste a largura conforme necessário */
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .audio-container img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 10px;
        }

        .microphone-icon {
            color: #4ad954;
            font-size: 24px;
            margin-left: 10px;
        }

        .visualizer {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: calc(100% - 20px);
            height: 20px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
        }

        .bar {
            display: inline-block;
            background-color: #4ad954;
            height: 100%;
            width: 4px;
            margin-right: 1px;
            animation: bounce 0.5s infinite alternate;
        }

        @keyframes bounce {
            0% { height: 10px; }
            100% { height: 20px; }
        }
    </style>
</head>
<body>
    <div class="audio-container" id="audioContainer">
        <audio class="plyr" src="https://s3.fr-par.scw.cloud/typebot/public/typebots/bh5pxkef9cd4as06rnz2o3k2/blocks/m435v6oefxku0cm0oyzcg2mb?v=1690997316079"></audio>
        <img src="https://i.postimg.cc/5NP3BZvj/david-2.png" alt="Imagem">
        <div class="microphone-icon">
            <i class="fas fa-microphone"></i>
        </div>
        <div class="visualizer" id="visualizer">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
    </div>

    <script src="https://cdn.plyr.io/3.6.7/plyr.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const player = new Plyr('.plyr', {
                controls: ['play', 'progress', 'current-time', 'duration']
            });

            const audioElement = document.querySelector('.plyr');
            const audioContainer = document.getElementById('audioContainer');

            audioContainer.addEventListener('click', function() {
                const playButton = audioContainer.querySelector('.plyr__controls button[data-plyr="play"]');
                playButton.click();
            });
        });
    </script>
</body>
</html>
