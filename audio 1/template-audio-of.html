<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Áudio</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.6.7/plyr.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap');

        body {
            height: 100vh;
            overflow: hidden;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0; /* Cor de fundo da página */
        }

        .audio-container {
            display: flex;
            align-items: center;
            background-color: #202c33; /* Cor de fundo da caixa de áudio */
            border-radius: 20px;
            padding: 10px;
            width: 300px; /* Largura da caixa de áudio */
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .audio-container img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 10px;
        }

        .plyr {
            flex-grow: 1; /* Para preencher o espaço restante */
            color: white; /* Cor do texto */
        }

        .plyr__controls {
            background: transparent; /* Fundo transparente */
        }

        .plyr--full-ui input[type=range] {
            background: #ffffff; /* Cor do track do slider */
        }

        .plyr--full-ui input[type=range]::-webkit-slider-thumb {
            background: #4ad954; /* Cor do botão do slider */
        }

        .microphone-icon {
            color: #4ad954; /* Cor do ícone do microfone */
            font-size: 24px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="audio-container" id="audioContainer">
        <audio class="plyr" src="https://s3.fr-par.scw.cloud/typebot/public/typebots/bh5pxkef9cd4as06rnz2o3k2/blocks/m435v6oefxku0cm0oyzcg2mb?v=1690997316079"></audio>
        <img src="https://i.postimg.cc/5NP3BZvj/david-2.png" alt="Imagem">
        <div class="microphone-icon">
            <i class="fas fa-microphone"></i>
        </div>
    </div>

    <script src="https://cdn.plyr.io/3.6.7/plyr.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const player = new Plyr('.plyr', {
                controls: ['play', 'progress', 'current-time', 'duration']
            });

            const audioElement = document.querySelector('.plyr');
            const audioContainer = document.getElementById('audioContainer');

            audioContainer.addEventListener('click', function() {
                const playButton = audioContainer.querySelector('.plyr__controls button[data-plyr="play"]');
                playButton.click();
            });
        });
    </script>
</body>
</html>
