<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Áudio</title>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.6.7/plyr.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap');
      
    body {
      height: 100vh;
      overflow: hidden;
      margin: 0;
    }    

    .audio-container {
      display: flex;
      align-items: center;
      background-color: #202c33; /* Cor de fundo do container */
      padding: 5px; /* Espaçamento interno */
      border-radius: 10px; /* Bordas arredondadas */
      width: auto; /* Largura automática */
      max-width: 80px; /* Largura máxima da caixa */
      cursor: default; /* Cursor padrão */
    }

    .audio-container img {
      width: 40px; /* Largura da imagem */
      height: 40px; /* Altura da imagem */
      border-radius: 50%;
      object-fit: cover;
      margin-right: 5px; /* Espaçamento à direita */
    }

    .microphone-icon {
      font-size: 18px; /* Tamanho do ícone do microfone */
      color: #4ad954; /* Cor do ícone */
    }

    .plyr--audio .plyr__controls {
      background: rgba(0, 0, 0, 0);
      color: #4a5464;
      display: none; /* Oculta os controles */
    }

    /* Estilo do botão de play */
    .play-button {
      background: none;
      border: none;
      cursor: pointer;
      outline: none;
    }

    .hide {
      display: none;
    }
  </style>
</head>
<body>
  <div class="audio-container" id="audioContainer">
    <audio class="plyr" src="https://s3.fr-par.scw.cloud/typebot/public/typebots/bh5pxkef9cd4as06rnz2o3k2/blocks/m435v6oefxku0cm0oyzcg2mb?v=1690997316079"></audio>
    <img src="https://i.postimg.cc/5NP3BZvj/david-2.png" alt="Imagem">
    <button class="play-button" id="playButton">
      <i class="fas fa-play"></i> <!-- Ícone do play -->
    </button>
    <div class="microphone-icon">
      <i class="fas fa-microphone"></i>
    </div>
  </div>
  
  <script src="https://cdn.plyr.io/3.6.7/plyr.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const player = new Plyr('.plyr', {
        controls: ['play', 'progress', 'current-time', 'duration']
      });

      const audioElement = document.querySelector('.plyr');
      const playButton = document.getElementById('playButton');

      playButton.addEventListener('click', function() {
        if (audioElement.paused) {
          audioElement.play();
          playButton.innerHTML = '<i class="fas fa-pause"></i>'; // Troca para o ícone de pausa
        } else {
          audioElement.pause();
          playButton.innerHTML = '<i class="fas fa-play"></i>'; // Troca para o ícone de play
        }
      });

      audioElement.addEventListener('ended', function() {
        playButton.innerHTML = '<i class="fas fa-play"></i>'; // Reseta para o ícone de play quando o áudio termina
      });
    });
  </script>
</body>
</html>
